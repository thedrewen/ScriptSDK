name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and previous tag
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 -x "$TAG" | tail -n1)
          if [ "$PREV_TAG" = "$TAG" ]; then
            PREV_TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies
        run: npm ci

      - name: Build JS SDK (lib -> JS)
        run: npm run build

      - name: Package compiled lib as zip
        run: |
          find dist/lib -name "*.ts" -delete
          cd dist/lib
          zip -r "../../scriptsdk-lib-${{ steps.vars.outputs.tag }}.zip" .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pipx
        run: python -m pip install --upgrade pipx

      - name: Build Python wheel
        run: npm run buildp

      - name: Render release notes from template
        run: |
          sed -e "s/{{TAG}}/${{ steps.vars.outputs.tag }}/g" \
              -e "s/{{PREVIOUS_TAG}}/${{ steps.vars.outputs.prev_tag }}/g" \
              .github/release_template.md > release_notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body_path: release_notes.md
          draft: true
          files: |
            scriptsdk-lib-${{ steps.vars.outputs.tag }}.zip
            dist/*.whl
